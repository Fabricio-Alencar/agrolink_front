<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroConnect - Produtores</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../static/css2/geral/global.css">
    <link rel="stylesheet" href="../static/css2/geral/base.css">
    <link rel="stylesheet" href="../static/css2/geral/header.css">
    <link rel="stylesheet" href="../static/css2/geral/layout.css">
    <link rel="stylesheet" href="../static/css2/geral/barra_busca.css">
    <link rel="stylesheet" href="../static/css2/geral/categorias.css">
    <link rel="stylesheet" href="../static/css2/geral/drawer.css">
    <link rel="stylesheet" href="../static/css2/geral/notificacao.css">



    <link rel="stylesheet" href="../static/css2/marketplace/grid.css">
    <link rel="stylesheet" href="../static/css2/marketplace/side_bar.css">
    <link rel="stylesheet" href="../static/css2/marketplace/modal_pedidos.css">
    <link rel="stylesheet" href="../static/css2/marketplace/card_produtos.css">

    <link rel="stylesheet" href="../static/css2/meus_produtos/cards/sem_produto.css">




    <!-- ícone da aba de navegação -->
    <link rel="icon" type="image/png" href="../static/assets/login/minhoca_pequena.png">
</head>

<body>

<header class="header">
    <button class="btn-menu-hamburger" id="botaoAbrirMenu">
        <span></span>
        <span></span>
        <span></span>
    </button>
    <div class="logo">🌱 AgroLink</div>
</header>

<!-- =========================
     MENU LATERAL
========================= -->
<aside class="painel-lateral" id="painelLateral">
    <div class="painel-cabecalho-verde">
        <h1 class="painel-logo-drawer">AgroLink</h1>
        <button class="botao-fechar-drawer" id="botaoFecharMenu">&times;</button>
    </div>

    <div class="painel-conteudo">
        <!-- USUÁRIO -->
        <div class="cartao-usuario">
            <img src="../static/assets/login/minhoca_pequena.png" alt="Foto de Perfil" class="usuario-foto">
            <div class="usuario-dados">
                <strong class="usuario-nome" id="usuarioNome">Carregando...</strong>
                <span class="usuario-tipo" id="usuarioTipo">...</span>
            </div>
        </div>

        <!-- NAVEGAÇÃO -->
        <nav class="painel-navegacao">
            <!-- O drawer.js coloca os links aqui -->
        </nav>

        <!-- RODAPÉ -->
        <footer class="painel-rodape">
            <button class="botao-logout" onclick="Auth.logout()">
                <span class="icone-box">
                    <i data-lucide="log-out"></i>
                </span>
                Sair da Conta
            </button>
        </footer>
    </div>
</aside>

<!-- =========================
     MÁSCARA
========================= -->
<div id="mascaraMenu" class="mascara-menu"></div>


<main class="main">
    <section class="topo">
        <h1>Marketplace</h1>
    </section>

    <section class="busca">
        <div class="barra-busca">
            <i data-lucide="search" class="icone-busca"></i>
            <input id="searchInput" type="text" placeholder="Pesquisar Produtos...">
        </div>
    </section>



    <!-- CONTAINER PRINCIPAL -->
    <div class="main-container">

        <!-- SIDEBAR DE FILTROS -->
        <aside class="sidebar">

            <div class="filtro">

                <!-- TÍTULO DOS FILTROS -->
                <div class="cabecalho-filtro">
                    <svg viewBox="0 0 24 24">
                        <path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/>
                    </svg>
                    Filtros
                </div>

                <!-- FILTRO POR CATEGORIA -->
                <div class="grupo-filtro">
                    <label>Categoria</label>

                    <select id="filterCategory">
                        <option value="Todos">Todos</option>
                        <option value="frutas">Frutas</option>
                        <option value="legumes">Legumes</option>
                        <option value="hortalicas">Hortaliças</option>
                        <option value="graos">Grãos e Cereais</option>
                        <option value="oleaginosas">Oleaginosas e Sementes</option>
                        <option value="ervas">Ervas e Temperos</option>
                        <option value="outros">Outros</option>
                    </select>
                </div>

                <!-- FILTRO POR ESTADO -->
                <div class="grupo-filtro">
                    <label>Estado</label>
                    <select id="filterEstado">
                        <option value="">Selecione o estado</option>
                    </select>
                </div>

                <!-- FILTRO POR CIDADE -->
                <div class="grupo-filtro">
                    <label>Cidade</label>
                    <select id="filterCidade">
                        <option value="">Selecione a cidade</option>
                    </select>
                </div>

            </div>

            <!-- CONTADOR DE RESULTADOS -->
            <p class="contador-resultados" id="resultsCount">
                0 Produtos encontrados
            </p>

        </aside>

        <!-- GRID DE PRODUTOS -->
        <main class="grade-produtos" id="productsGrid">

            <p id="mensagemCarregandoMarketplace" class="mensagem-carregando">
                Buscando produtos disponíveis...
            </p>

        </main>

    </div>
</main>

    <!-- MODAL DE PEDIDO -->
    <div class="modal-overlay" id="orderModal">

        <div class="modal-content">

            <!-- BOTÃO VOLTAR -->
            <button class="btn-voltar" onclick="fecharModal()">
                <i data-lucide="arrow-left"></i>
                <span>Voltar</span>
            </button>
            
            <!-- TÍTULO -->
            <h2 class="modal-title">Criar Pedido</h2>

            <div class="modal-grid">

                <!-- COLUNA ESQUERDA (FORMULÁRIO) -->
                <div>

                    <!-- QUANTIDADE -->
                    <div class="form-group">
                        <label>Quantidade <span>*</span></label>

                        <div class="qtd-row">
                            <input type="number" id="inputQtd" class="form-control" placeholder="0" min="1">

                            <!-- UNIDADE -->
                            <div class="unit-display">
                                <span>Unidade</span>
                                <strong id="modalUnit">Kg</strong>
                            </div>
                        </div>
                    </div>

                    <!-- DATA -->
                    <div class="form-group">
                        <label>Data de Entrega <span>*</span></label>
                        <input type="date" id="inputData" class="form-control">
                    </div>

                    <!-- DESCRIÇÃO -->
                    <div class="form-group">
                        <label>Descrição (Opcional)</label>
                        <textarea id="inputDesc" class="form-control" placeholder="Ex: instruções de entrega"></textarea>
                    </div>

                </div>

                <!-- COLUNA DIREITA (RESUMO) -->
                <div>
                    <div class="resumo-box">
                        <h3>Resumo do Pedido</h3>

                        <div class="resumo-item">Produto: <strong id="resumoProduto">-</strong></div>
                        <div class="resumo-item">Produtor: <strong id="resumoProdutor">-</strong></div>

                        <div class="resumo-item">Quantidade: <strong id="resumoQtd">- Kg</strong></div>
                        <div class="resumo-item">Data: <strong id="resumoData">-</strong></div>
                    </div>
                </div>

            </div>

            <!-- BOTÃO FINAL -->
            <button class="btn-publicar" onclick="emitirPedido()">
                Publicar Pedido
            </button>

        </div>
    </div>









<script src="https://unpkg.com/lucide@latest"></script>
<script>
  lucide.createIcons();
</script>
<script src="../static/js/config.js"></script>
<script src="../static/js/auth.js"></script>
<script type="module" src="../static/js/drawer.js"></script>
<script type="module" src="../static/js/estabelecimentos/market_place_estabelecimentos/main.js"></script>
<script src="../static/js/notificacao.js"></script>



</body>
</html>
