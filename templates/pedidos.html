<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroConnect - Pedidos</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../static/css2/geral/global.css">
    <link rel="stylesheet" href="../static/css2/geral/base.css">
    <link rel="stylesheet" href="../static/css2/geral/header.css">
    <link rel="stylesheet" href="../static/css2/geral/layout.css">
    <link rel="stylesheet" href="../static/css2/geral/barra_busca.css">
    <link rel="stylesheet" href="../static/css2/geral/categorias.css">
    <link rel="stylesheet" href="../static/css2/geral/notificacao.css">
    <link rel="stylesheet" href="../static/css2/geral/drawer.css">
    <link rel="stylesheet" href="../static/css2/geral/sem_produto.css">


    <link rel="stylesheet" href="../static/css2/pedidos/calendario.css">

    <link rel="stylesheet" href="../static/css2/pedidos/grid.css">
    <link rel="stylesheet" href="../static/css2/pedidos/card_pedidos.css">
    <link rel="stylesheet" href="../static/css2/pedidos/badges_status.css">
    <link rel="stylesheet" href="../static/css2/pedidos/pag_detalhes.css">
    <link rel="stylesheet" href="../static/css2/pedidos/botao_whatsapp.css">



    <!-- ícone da aba de navegação -->
    <link rel="icon" type="image/png" href="../static/assets/login/minhoca_pequena.png">
</head>
<body>

<header class="header">
    <button class="btn-menu-hamburger" id="botaoAbrirMenu">
        <span></span>
        <span></span>
        <span></span>
    </button>
    <div class="logo">🌱 AgroLink</div>
</header>

<!-- =========================
     MENU LATERAL
========================= -->
<aside class="painel-lateral" id="painelLateral">
    <div class="painel-cabecalho-verde">
        <h1 class="painel-logo-drawer">AgroLink</h1>
        <button class="botao-fechar-drawer" id="botaoFecharMenu">&times;</button>
    </div>

    <div class="painel-conteudo">
        <!-- USUÁRIO -->
        <div class="cartao-usuario">
            <img src="../static/assets/login/minhoca_pequena.png" alt="Foto de Perfil" class="usuario-foto">
            <div class="usuario-dados">
                <strong class="usuario-nome" id="usuarioNome">Carregando...</strong>
                <span class="usuario-tipo" id="usuarioTipo">...</span>
            </div>
        </div>

        <!-- NAVEGAÇÃO -->
        <nav class="painel-navegacao">
            <!-- O drawer.js coloca os links aqui -->
        </nav>

        <!-- RODAPÉ -->
        <footer class="painel-rodape">
            <button class="botao-logout" onclick="Auth.logout()">
                <span class="icone-box">
                    <i data-lucide="log-out"></i>
                </span>
                Sair da Conta
            </button>
        </footer>
    </div>
</aside>

<!-- =========================
     MÁSCARA
========================= -->
<div id="mascaraMenu" class="mascara-menu"></div>

<!-- =========================
     VISTA DE LISTA
========================= -->
<main id="view-lista" class="main">
    <!-- =========================
         TOPO
    ========================= -->
    <section class="topo">
        <h1>Pedidos</h1>

        <div class="view-toggle">
            <button class="toggle-btn active" id="btnLista" type="button">
                <i data-lucide="list"></i>
                <span>Lista</span>
            </button>

            <button class="toggle-btn" id="btnCalendario" type="button">
                <i data-lucide="calendar-days"></i>
                <span>Calendário</span>
            </button>
        </div>
    </section>

    <!-- =========================
         BUSCA + FILTRO
    ========================= -->
    <section class="busca">
        <div class="barra-busca">
            <i data-lucide="search" class="icone-busca"></i>
            <input id="searchInput" type="text" placeholder="Buscar produtos ou produtores...">
        </div>

        <select id="statusFilter" class="filtro-status">
            <option value="Todos">Status (Todos)</option>
            <option value="Pendente">Pendentes</option>
            <option value="Aceito">Aceitos</option>
            <option value="Entregue">Entregues</option>
            <option value="Finalizado">Finalizados</option>
            <option value="Cancelado">Cancelados</option>
        </select>
    </section>

    <!-- =========================
         CARDS
    ========================= -->
    <div id="orders-grid" class="orders-grid">

        <div id="mensagemCarregandoPedidos" class="carregando-produtos">
            <div class="spinner-produtos"></div>

            <p>Buscando pedidos...</p>
        </div>

    </div>
</main>

<!-- =========================
     VISTA DE CALENDÁRIO
========================= -->
<main id="view-calendario" class="main" style="display: none;">
    <section class="topo">
        <h1>Pedidos</h1>

        <div class="view-toggle">
            <button class="toggle-btn" id="btnListaCalendario" type="button">
                <i data-lucide="list"></i>
                <span>Lista</span>
            </button>

            <button class="toggle-btn active" id="btnCalendarioLista" type="button">
                <i data-lucide="calendar-days"></i>
                <span>Calendário</span>
            </button>
        </div>
    </section>

    <!-- =========================
         CALENDÁRIO
    ========================= -->
    <section class="calendar-view">
        <!-- Cabeçalho -->
        <div class="calendar-header">
            <button id="btnMesAnterior" class="calendar-nav" type="button" aria-label="Mês anterior">
                <i data-lucide="chevron-left"></i>
            </button>

            <h2 id="calendarTitle"></h2>

            <button id="btnProximoMes" class="calendar-nav" type="button" aria-label="Próximo mês">
                <i data-lucide="chevron-right"></i>
            </button>
        </div>

        <!-- Voltar para hoje -->
        <button id="btnHoje" class="calendar-today" type="button">
            <i data-lucide="calendar-check"></i>
            Hoje
        </button>

        <!-- Dias da semana -->
        <div class="calendar-weekdays">
            <span>Dom</span>
            <span>Seg</span>
            <span>Ter</span>
            <span>Qua</span>
            <span>Qui</span>
            <span>Sex</span>
            <span>Sáb</span>
        </div>

        <!-- Dias -->
        <div id="calendarGrid" class="calendar-grid"></div>
    </section>
</main>

<!-- =========================
     DETALHES
========================= -->
<main id="view-detalhes" class="container" style="display: none;">
    <button onclick="hideDetails()" class="btn-back">
        <i data-lucide="arrow-left"></i>
        Voltar
    </button>

    <div class="details-card" id="details-content"></div>
</main>

<script src="https://unpkg.com/lucide@latest"></script>
<script>
    lucide.createIcons();
</script>
<script src="../static/js/config.js"></script>
<script src="../static/js/auth.js"></script>
<script type="module" src="../static/js/drawer.js"></script>
<script type="module" src="../static/js/negociacoes/main.js"></script>
<script type="module" src="../static/js/negociacoes/whatsapp.js"></script>
<script type="module" src="../static/js/negociacoes/calendario.js"></script>
</body>
</html>
